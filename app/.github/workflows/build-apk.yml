name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION"
          
          # Extract major version
          if [[ "$JAVA_VERSION" =~ ^1\.([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          else
            JAVA_MAJOR="${JAVA_VERSION%%.*}"
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but found version $JAVA_MAJOR."
            exit 1
          fi
          echo "Java version verification passed: >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore successfully confirmed at $KEYSTORE_PATH."
          else
            echo "Error: Failed to create debug keystore."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH."
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: The APK file is empty (0 bytes)."
            exit 1
          fi
          
          echo "APK verification successful: $APK_PATH is a valid non-empty regular file."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUN_NUMBER="${{ github.run_number }}"
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          SANITIZED_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          
          ASSET_DIR="$(mktemp -d)"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_DIR/$ASSET_NAME"
          
          echo "release_asset_path=$ASSET_DIR/$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $ASSET_DIR/$ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset not found or empty at $ASSET_PATH."
            exit 1
          fi
          
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG_NAME="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug Build #${RUN_NUMBER}"
          TARGET_SHA="${{ github.sha }}"
          
          RELEASE_NOTES="This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          The GitHub Actions run number: ${RUN_NUMBER}
          The GitHub Actions run attempt: ${RUN_ATTEMPT}
          The source commit SHA: ${TARGET_SHA}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore."
          
          echo "Creating release $TAG_NAME targeting commit $TARGET_SHA..."
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$TARGET_SHA" \
            --latest \
            "$ASSET_PATH"
          
          echo "Release published successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG_NAME="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          ASSET_FILENAME=$(basename "$ASSET_PATH")
          REPO="${{ github.repository }}"
          
          if [ "$RELEASE_OUTCOME" == "success" ]; then
            echo "Release publishing succeeded."
            gh release view "$TAG_NAME" --repo "$REPO" || true
            RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG_NAME"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug Build #$RUN_NUMBER"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"
            
            {
              echo "### 🚀 APK Release Successful"
              echo "- **Release Page URL**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Release Tag**: \`$TAG_NAME\`"
              echo "- **APK Asset Filename**: \`$ASSET_FILENAME\`"
              echo ""
              echo "The APK can be downloaded directly from the release **Assets** section above."
              echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: GitHub Release publishing failed or was skipped."
            echo "State: The APK build and Actions artifact upload succeeded."
            echo "The normal Actions artifact named \`app-debug-apk\` remains fully available."
            
            {
              echo "### ⚠️ APK Build Succeeded (Release Publishing Warning)"
              echo "- The APK build and Actions artifact upload **succeeded**."
              echo "- GitHub Release publishing encountered an issue or was skipped."
              echo "- The normal Actions artifact named \`app-debug-apk\` remains available as a backup."
            } >> $GITHUB_STEP_SUMMARY
          fi
